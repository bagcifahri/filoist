# Filoist: günlük tarama ve iPhone sürümünün yayını (https://bagcifahri.github.io/filoist/)
#
# - Her gece 01:00'de (İstanbul) kaynaklar taranır; değişiklik varsa veri kaydedilir ve site yeniden yayınlanır.
#   Son 6 saatte başarılı bir tarama yapıldıysa (ör. elle) o geceki tarama atlanır (kontrol işi).
# - Tarama iki parçadır:
#   1. oho: ÖHO sitesi (emreunel159.com) GitHub'ın kendi sunucusunda okunur ve veri/oho.json depoya kaydedilir.
#      Site sahibi Emre GitHub engelini kaldırdı (21.11.2026) ve sayfalar arasında 1-2 sn ara istedi; sayfa başına
#      sunucusunda ~15 veritabanı sorgusu çalışıyor. Site yalnız bu işte, gecede bir kez okunur.
#   2. tara: Türkiye'deki Filoist sunucusunda (Windows, GitHub "self-hosted runner", etiketi: filoist) İBB ve
#      busphoto.eu okunur (ikisi de GitHub'ı engelliyor), ÖHO listesi depodan alınır, hepsi birleştirilir.
#      Sunucu ÖHO sitesine bağlanmaz. Kurulum: sunucu/ klasöründeki "Filoist sunucu kurulumu.bat".
#   ÖHO okunamazsa son kayıt kullanılır; sunucu kapalıysa ÖHO listesi yine depoya kaydedilmiş olur.
# - Site yayını ve bildirim GitHub'ın kendi sunucularında yapılır (Windows'ta Pages adımları sorun çıkarabiliyor).
# - Her taramanın sonucu "Günlük tarama raporu" konusuna yorum olarak yazılır; GitHub bildirim gönderir.
#   Sunucu kapalıysa tarama yapılamaz; bu da rapor olarak bildirilir.
# - Bilgisayardan yayinla.py ile kod gönderildiğinde (push) tarama yapılmadan yalnızca site yayınlanır.
# - Actions sekmesindeki "Run workflow" düğmesi taramayı elle başlatır.
#
# Güvenlik: depo herkese açık. İş akışı pull_request ile tetiklenmez; böylece başkalarının önerdiği kod
# sunucuda çalışamaz. Bu dosyaya pull_request tetikleyicisi EKLENMEMELİ.
name: Filoist

on:
  schedule:
    # 22:00 UTC = 01:00 İstanbul: ÖHO sitesinin en sakin saati. Tarama ~20-30 dk sürer.
    # (GitHub yoğunlukta başlangıcı birkaç dakika geciktirebilir)
    - cron: '0 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: filoist
  cancel-in-progress: false

jobs:
  kontrol:
    # Gece taraması, son 6 saatte başarılı bir tarama (ör. elle başlatılan) yapıldıysa atlanır:
    # Emre'nin sitesi aynı gece ikinci kez boşuna okunmasın. Elle başlatılan tarama hiç atlanmaz.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      atla: ${{ steps.bak.outputs.atla }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Son taramaya bak
        id: bak
        shell: python
        run: |
          import datetime, json, os
          simdi = datetime.datetime.now(datetime.timezone.utc)
          def yas(yol, alan):
              try:
                  return simdi - datetime.datetime.fromisoformat(json.load(open(yol, encoding='utf-8'))[alan])
              except Exception:
                  return datetime.timedelta(days=999)
          # İkisi de taze olmalı: ÖHO listesi ve tüm kaynakların birleştirildiği son başarılı tarama
          y = max(yas('veri/oho.json', 'tarih'), yas('veri/durum.json', 'sonKontrol'))
          atla = y < datetime.timedelta(hours=6)
          print(f'Son başarılı tarama {y} önce → ' + ('atlanıyor' if atla else 'tarama yapılacak'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'atla={"true" if atla else "false"}\n')

  oho:
    needs: kontrol
    if: ${{ !cancelled() && github.event_name != 'push' && needs.kontrol.outputs.atla != 'true' }}
    runs-on: ubuntu-latest
    # Sayfalar 2-2,5 sn arayla okunur: 342 sayfa ~15-20 dk; site yavaş yanıt verirse pay kalsın diye 60 dk.
    # (Siteye giden istek sayısını süre değil, kodun istek tavanı sınırlar.)
    timeout-minutes: 60
    outputs:
      ozet: ${{ steps.oku.outputs.ozet }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: ÖHO sitesini oku
        id: oku
        env:
          PYTHONIOENCODING: utf-8
          # ÖHO sitesinin Filoist'e tanıdığı geçiş anahtarı (Settings → Secrets and variables → Actions); yoksa boş
          OHO_ANAHTAR: ${{ secrets.OHO_ANAHTAR }}
        run: python scripts/guncelle.py --yalniz-oho

      - name: ÖHO listesini kaydet
        run: |
          git config user.name 'Filoist tarama'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veri/oho.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "ÖHO listesi $(TZ=Europe/Istanbul date '+%d.%m.%Y %H:%M')"
          # Aynı anda bilgisayardan gönderim olduysa üstüne eklenir; oho.json'da çakışırsa yeni okunan esas alınır
          for i in 1 2 3; do
            if git pull -q --rebase -X theirs origin main && git push -q origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1

  tara:
    needs: [kontrol, oho]
    # ÖHO okunamasa da tarama yapılır (ÖHO'nun son kaydıyla)
    if: ${{ !cancelled() && github.event_name != 'push' && needs.kontrol.outputs.atla != 'true' }}
    runs-on: [self-hosted, windows, filoist]
    # Yalnız İBB ve busphoto.eu okunur (genelde birkaç dakika); ÖHO sitesine bağlanılmaz. Siteler yavaş yanıt verince
    # yeniden denemeler uzayabilir; iş kesilirse İETT verisi de kaydedilmez, o yüzden geniş pay
    timeout-minutes: 120
    outputs:
      sonuc: ${{ steps.tara.outcome }}
    defaults:
      run:
        # Sunucuda Windows'un betik çalıştırma izni kapalı (Restricted). Sistem ayarı değiştirilmez;
        # izin yalnızca bu adımların PowerShell işlemi için verilir
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    env:
      PYTHONIOENCODING: utf-8
    steps:
      # Windows'taki Git satır sonlarını değiştirmesin; veri dosyaları depodaki gibi (LF) kalsın
      - name: Git ayarı
        run: git config --global core.autocrlf false

      # Tetikleyen commit değil main'in son hali: oho işinin az önce kaydettiği ÖHO listesi de gelsin
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Kaynakları tara
        id: tara
        env:
          RAPOR: ${{ runner.temp }}\rapor.md
        run: |
          python scripts/guncelle.py --oho-depodan
          exit $LASTEXITCODE

      - name: Veriyi kaydet
        if: ${{ !cancelled() }}
        run: |
          git config user.name 'Filoist tarama'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veri/filo.json veri/durum.json veri/iett_canli.json veri/busphoto.json uygulama/filo.js
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          $zaman = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Turkey Standard Time').ToString('dd.MM.yyyy HH:mm')
          git commit -q -m "Günlük tarama $zaman"
          # Aynı anda bilgisayardan gönderim olduysa üstüne eklenir. Veri dosyalarında çakışma olursa taramanın
          # yeni verisi esas alınır (-X theirs: yeniden uygulanan tarama commit'i); yine olmazsa birleştirme geri alınır
          foreach ($i in 1..3) {
            git pull -q --rebase -X theirs origin main
            if ($LASTEXITCODE -eq 0) { git push -q origin HEAD:main; if ($LASTEXITCODE -eq 0) { exit 0 } }
            # Yönlendirme (2>$null) yazılmaz: Windows PowerShell 5.1'de git'in uyarısını hataya çevirip adımı düşürür
            git rebase --abort
            Start-Sleep 5
          }
          exit 1

      - name: Raporu sakla
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: rapor
          path: ${{ runner.temp }}\rapor.md
          if-no-files-found: ignore
          retention-days: 7

  yayinla:
    needs: tara
    # Push'ta tarama atlanır, site yine yayınlanır; tarama başarısızsa (kaynak bozuk) yayın yapılmaz
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.tara.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.yayin.outputs.page_url || steps.yayin2.outputs.page_url }}
    steps:
      # Taramanın az önce kaydettiği veri de gelsin diye tetikleyen commit değil, main'in son hali alınır
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Gerekli Python paketi (simge çizimi)
        run: pip install --quiet pillow

      - name: Siteyi hazırla
        run: python iphone/pwa_hazirla.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: iphone/site
          include-hidden-files: true

      # GitHub bazen az önce yüklenen site paketini hemen göremiyor (24.11.2026: "No artifacts named github-pages").
      # Böyle geçici bir aksaklıkta yayın kaybolmasın diye kısa bir beklemeden sonra bir kez daha denenir
      - name: Yayınla
        id: yayin
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Yeniden denemeden önce bekle
        if: steps.yayin.outcome == 'failure'
        run: sleep 45

      - name: Yayınla (ikinci deneme)
        id: yayin2
        if: steps.yayin.outcome == 'failure'
        uses: actions/deploy-pages@v4

  bildir:
    needs: [kontrol, oho, tara, yayinla]
    # Sunucu kapalıyken tarama hiç başlamasa da (iptal/zaman aşımı) rapor gitsin; bilerek atlanan gece taramasında gitmez
    if: ${{ always() && github.event_name != 'push' && needs.kontrol.outputs.atla != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: rapor
          path: rapor

      - name: Bildirim gönder
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SAHIP: ${{ github.repository_owner }}
          KAYIT: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARAMA: ${{ needs.tara.result }}
          OHO_IS: ${{ needs.oho.result }}
          OHO_OZET: ${{ needs.oho.outputs.ozet }}
          YAYIN: ${{ needs.yayinla.result }}
        run: |
          RAPOR=rapor/rapor.md
          mkdir -p rapor
          if [ ! -f "$RAPOR" ]; then
            case "$TARAMA" in
              cancelled|skipped) printf '❌ **Tarama yapılamadı:** Filoist sunucusu kapalı ya da internete bağlı değil olabilir.\n\n' > "$RAPOR" ;;
              *) printf '❌ **Tarama beklenmedik bir hatayla durdu.**\n\n' > "$RAPOR" ;;
            esac
          fi
          # ÖHO işinin sonucu (GitHub'da ayrı okunur)
          if [ -n "$OHO_OZET" ]; then
            printf '%s\n\n' "$OHO_OZET" >> "$RAPOR"
          fi
          # Okuma bittiği halde liste kaydedilemediyse ya da iş beklenmedik biçimde durduysa
          if [ "$OHO_IS" != "success" ]; then
            printf '⚠️ ÖHO işi tamamlanamadı (%s); ÖHO için son kayıt kullanıldı.\n\n' "$OHO_IS" >> "$RAPOR"
          fi
          case "$YAYIN" in
            success) echo "🌐 Site yayınlandı: https://bagcifahri.github.io/filoist/" >> "$RAPOR" ;;
            skipped) echo "🌐 Site yayınlanmadı." >> "$RAPOR" ;;
            *) echo "❌ Site yayınlanamadı." >> "$RAPOR" ;;
          esac
          printf '\n[Çalışma kaydı](%s)\n' "$KAYIT" >> "$RAPOR"
          BASLIK='Günlük tarama raporu'
          NO=$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$BASLIK\") | .number" | head -n 1)
          if [ -z "$NO" ]; then
            # Konuyu açan bildirimde sahibin adı geçtiği için sonraki her yorum da ona bildirim olarak gider
            NO=$(gh issue create --title "$BASLIK" --body "@$SAHIP Filoist her gün kaynakları tarar ve sonucu bu konuya yorum olarak yazar. Bu konuyu kapatma; kapanırsa yeni bir konu açılır." | grep -o '[0-9]*$')
          fi
          gh issue comment "$NO" --body-file "$RAPOR"
